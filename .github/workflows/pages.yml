# Publishes the web version (iPad, iPhone, any browser) to GitHub Pages on every push to main.
# The Python model runs in the browser with Pyodide; see tools/build_web.py.
name: web version
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pillow
      - run: pytest -q
      - name: Get the Pyodide runtime
        run: |
          npm pack pyodide@0.29.5
          tar xzf pyodide-0.29.5.tgz
      - run: python tools/build_web.py --pyodide package --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
